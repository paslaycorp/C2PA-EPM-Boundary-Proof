name: Verify and attest boundary proof
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q

      - name: Verify exact EPM identity
        run: |
          python - <<'PY'
          import epm
          assert epm.EPM_ENGINE_VERSION == "epm-engine/0.1.2", epm.EPM_ENGINE_VERSION
          print(epm.EPM_ENGINE_VERSION)
          PY

      - name: Generate deterministic proof bundle
        if: github.event_name != 'pull_request'
        run: |
          python scripts/build_proofs.py
          python - <<'PY'
          import hashlib, pathlib, zipfile
          out = pathlib.Path("dist/c2pa-epm-boundary-proofs.zip")
          files = sorted(pathlib.Path("dist/proofs").glob("*.json"))
          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED) as z:
              for f in files:
                  z.write(f, f.relative_to("dist"))
          print("sha256", hashlib.sha256(out.read_bytes()).hexdigest())
          PY

      - name: Attest proof-bundle build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/c2pa-epm-boundary-proofs.zip

      - name: Upload proof bundle
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c2pa-epm-boundary-proofs
          path: dist/c2pa-epm-boundary-proofs.zip
          if-no-files-found: error
          retention-days: 14
